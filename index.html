<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f9ff">
<title>FrostWear — Fashion App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="status"><span id="clock">9:41</span><i aria-hidden="true"></i><span class="status-icons">▮▮ ◔</span></header>
  <main id="screen" aria-live="polite"></main>
  <nav class="bottom" aria-label="Main navigation">
    <button data-tab="home" class="active"><span>⌂</span><small>Home</small></button>
    <button data-tab="search"><span>⌕</span><small>Search</small></button>
    <button data-tab="saved"><span>♡</span><small>Saved</small></button>
    <button data-tab="bag"><span>♧</span><small>Bag</small><b id="count">0</b></button>
    <button data-tab="profile"><span>♙</span><small>Profile</small></button>
  </nav>
</div>
<div id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
